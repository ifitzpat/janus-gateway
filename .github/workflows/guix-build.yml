name: Guix Build

on:
  push:
    branches:
      - master
      - 'claude/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-with-guix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Guix cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/guix
            /gnu/store
          key: guix-cache-${{ github.sha }}
          restore-keys: |
            guix-cache-

      - name: Install Guix
        uses: PromyLOPh/guix-install-action@v1
        with:
          channels: |
            (list (channel
                    (name 'guix)
                    (url "https://git.savannah.gnu.org/git/guix.git")
                    (branch "master")
                    (introduction
                      (make-channel-introduction
                        "9edb3f66fd807b096b48283debdcddccfea34bad"
                        (openpgp-fingerprint
                          "BBB0 2DDF 2CEA F6A8 0D1D  E643 A2A0 6DF2 A33A 54FA"))))
                  (channel
                    (name 'nonguix)
                    (url "https://gitlab.com/nonguix/nonguix")
                    (branch "master")
                    (introduction
                      (make-channel-introduction
                        "897c1a470da759236cc11798f4e0a5f7d4d59fbc"
                        (openpgp-fingerprint
                          "2A39 3FFF 68F4 EF7A 3D29  12AF 6F51 20A0 22FB B2D5")))))

      - name: Configure substitute servers
        run: |
          echo "Substitute servers configured by guix-install-action"

      - name: Update Guix channels
        run: |
          guix pull --fallback
          hash guix

      - name: Build Janus with Guix
        run: |
          # Add current directory to GUIX_PACKAGE_PATH so Guix can find our package definition
          export GUIX_PACKAGE_PATH="$(pwd):$GUIX_PACKAGE_PATH"

          # Build the package
          guix build -f janus.scm --fallback --keep-failed --no-grafts

      - name: Show build log on failure
        if: failure()
        run: |
          # Try to find and display the build log
          guix build -f janus.scm --log-file || true
          find /var/log/guix -type f -name "*.log" -exec tail -n 100 {} \; || true

      - name: Package information
        if: success()
        run: |
          export GUIX_PACKAGE_PATH="$(pwd):$GUIX_PACKAGE_PATH"
          guix package -A janus
          guix show -f janus.scm || true

      - name: Save Guix cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cache/guix
            /gnu/store
          key: guix-cache-${{ github.sha }}
